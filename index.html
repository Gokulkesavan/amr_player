<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMR / AMR-WB Extractor</title>
<style>
:root{
  --bg:#0a0e13;--panel:#121a23;--panel2:#182230;--border:#233040;
  --text:#e6edf3;--muted:#8b98a8;--accent:#58a6ff;--ok:#3fb950;--warn:#d29922;--err:#f85149;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer}
code,pre{font-family:var(--mono)}

header{display:flex;align-items:center;gap:14px;padding:12px 20px;
  border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:20;flex-wrap:wrap}
header h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
header h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
header .spacer{flex:1}
header .fn{font-size:12.5px;color:var(--muted);font-family:var(--mono);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);
  padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;transition:.15s}
.btn:hover{background:#233043;border-color:#35485d}
.btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
.btn.primary:hover{background:#2d7ff5}
.btn.ok{background:#1f6f3d;border-color:#2a9a51;color:#fff}
.btn.ok:hover{background:#2a9a51}
.btn:disabled{opacity:.5;cursor:not-allowed}

.drop{max-width:700px;margin:10vh auto;text-align:center;padding:50px 28px;
  border:2px dashed var(--border);border-radius:16px;background:var(--panel)}
.drop.hot{border-color:var(--accent);background:#0f1c2b}
.drop h2{margin:0 0 12px;font-size:19px}
.drop p{color:var(--muted);margin:8px 0}
.spinner{width:40px;height:40px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

.container{max-width:1100px;margin:0 auto;padding:20px}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stat .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:22px;font-weight:700;font-family:var(--mono);margin-top:4px}

section{margin-bottom:26px}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
  margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}
section h2 .badge{background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0}

.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:13px;color:var(--text);font-weight:600;display:flex;
  align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:6px;
  background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-weight:500}
.tag.ok{color:#7ee2a0;border-color:#2a9a5155;background:#12261a}
.tag.warn{color:#e5b955;border-color:#d2992255;background:#241e10}
.tag.err{color:#ff9b94;border-color:#f8514955;background:#2a1518}
.tag.info{color:#8cc3ff;border-color:#1f6feb55;background:#0f1c2b}
.tag.big{font-size:12.5px;padding:4px 12px;font-weight:700}

.kv{display:grid;grid-template-columns:minmax(140px,auto) 1fr;gap:4px 16px;
  font-size:12.5px;padding:2px 0}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;font-family:var(--mono);word-break:break-all;font-size:12px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.panelbox{background:#0d141c;border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.panelbox h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);font-weight:600}
.frow{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;
  border-bottom:1px solid #1c2530;font-family:var(--mono)}
.frow:last-child{border-bottom:none}
.frow .k{color:var(--muted)}
.frow .v{color:var(--text);font-weight:600}

pre{background:#080c11;border:1px solid var(--border);border-radius:8px;padding:12px 14px;
  font-size:12px;overflow:auto;color:#c9d5e1;line-height:1.5;margin:8px 0}
pre .cm{color:#6b7d92;font-style:italic}

.warnbox{background:#241e10;border:1px solid #d2992255;color:#e5b955;
  padding:11px 14px;border-radius:8px;font-size:12.5px;margin-bottom:14px;line-height:1.6}
.errbox{background:#2a1518;border:1px solid #f8514955;color:#ffb4b4;
  padding:11px 14px;border-radius:8px;font-size:12.5px;margin-bottom:14px}
.okbox{background:#12261a;border:1px solid #2a9a5155;color:#a3e6b8;
  padding:11px 14px;border-radius:8px;font-size:12.5px;margin-bottom:14px}
.infobox{background:#0f1c2b;border:1px solid #1f6feb55;color:#8cc3ff;
  padding:11px 14px;border-radius:8px;font-size:12.5px;margin-bottom:14px}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.hint{color:var(--muted);font-size:12px;font-style:italic}

.bytes{font-family:var(--mono);font-size:11px;color:#a5b3c4;
  background:#080c11;border:1px solid var(--border);border-radius:6px;
  padding:8px 10px;overflow-x:auto;white-space:pre}

.fflog{font-family:var(--mono);font-size:11px;color:#a5b3c4;
  background:#080c11;border:1px solid var(--border);border-radius:6px;
  padding:8px 10px;max-height:140px;overflow:auto;white-space:pre-wrap;
  margin-top:8px;display:none}
.fflog.show{display:block}

.progress{height:4px;background:#1c2530;border-radius:2px;overflow:hidden;margin-top:8px}
.progress > div{height:100%;background:var(--accent);width:0;transition:width .2s}
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span>AMR / AMR-WB Extractor</h1>
  <span class="fn" id="fileName"></span>
  <span class="spacer"></span>
  <button class="btn primary" id="openBtn">Open .pcap / .pcapng…</button>
  <input type="file" id="fileInput" accept=".pcap,.pcapng,.cap" hidden>
</header>

<div class="drop" id="drop">
  <h2>📻 Drop a <code>.pcap</code> or <code>.pcapng</code></h2>
  <p>…or <button class="btn primary" id="pickBtn">browse for a capture</button></p>
  <p class="hint" style="margin-top:22px;max-width:540px;margin-left:auto;margin-right:auto;text-align:left">
    Reads SIP/SDP to learn the AMR mode, correlates RTP streams, and writes proper
    <code>.amr</code> / <code>.awb</code> files — with lost frames padded as
    <code>NO_DATA</code> so the duration stays correct. WAV conversion runs
    entirely in your browser via <b>ffmpeg.wasm</b>.
  </p>
</div>

<div id="app" hidden><div class="container" id="content"></div></div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script>
/* =====================================================================
   PCAP / PCAPNG
   ===================================================================== */
function parsePcap(buffer){
  const dv = new DataView(buffer);
  const magic = dv.getUint32(0, false);
  let le, ns;
  if      (magic === 0xa1b2c3d4) { le = false; ns = false; }
  else if (magic === 0xd4c3b2a1) { le = true;  ns = false; }
  else if (magic === 0xa1b23c4d) { le = false; ns = true;  }
  else if (magic === 0x4d3cb2a1) { le = true;  ns = true;  }
  else throw new Error('Not a classic pcap file (bad magic 0x' + magic.toString(16) + ')');

  const linktype = dv.getUint32(20, le);
  const packets = [];
  let off = 24;
  const len = buffer.byteLength;
  while (off + 16 <= len){
    const tsSec  = dv.getUint32(off, le);
    const tsFrac = dv.getUint32(off + 4, le);
    const incl   = dv.getUint32(off + 8, le);
    const orig   = dv.getUint32(off + 12, le);
    off += 16;
    if (off + incl > len) break;
    packets.push({ ts: tsSec + tsFrac / (ns ? 1e9 : 1e6), incl, orig,
      data: new Uint8Array(buffer, off, incl), linktype });
    off += incl;
  }
  return packets;
}

function parsePcapNg(buffer){
  const dv = new DataView(buffer);
  const len = buffer.byteLength;
  let off = 0, le = true;
  const packets = [];
  let ifaces = [];

  function readOpts(o, end){
    const opts = [];
    while (o + 4 <= end){
      const code = dv.getUint16(o, le);
      const l = dv.getUint16(o + 2, le);
      if (code === 0) break;
      if (o + 4 + l > end) break;
      opts.push({ code, data: new Uint8Array(buffer, dv.byteOffset + o + 4, l) });
      o = (o + 4 + l + 3) & ~3;
    }
    return opts;
  }

  while (off + 12 <= len){
    let bt = dv.getUint32(off, le);
    let bl = dv.getUint32(off + 4, le);
    if (bt === 0x0A0D0D0A){
      const bomLE = dv.getUint32(off + 8, true);
      le = (bomLE === 0x1A2B3C4D);
      bl = dv.getUint32(off + 4, le);
      ifaces = [];
    } else if (bt === 0x00000001){
      const lt = dv.getUint16(off + 8, le);
      let divisor = 1e6;
      const opts = readOpts(off + 16, off + bl - 4);
      for (const o of opts){
        if (o.code === 9 && o.data.length >= 1){
          const v = o.data[0];
          divisor = (v & 0x80) ? Math.pow(2, v & 0x7F) : Math.pow(10, v);
        }
      }
      ifaces.push({ linktype: lt, divisor });
    } else if (bt === 0x00000006){
      const ifId = dv.getUint32(off + 8, le);
      const th = dv.getUint32(off + 12, le);
      const tl = dv.getUint32(off + 16, le);
      const capLen = dv.getUint32(off + 20, le);
      const orig = dv.getUint32(off + 24, le);
      const iface = ifaces[ifId] || { linktype: 1, divisor: 1e6 };
      if (off + 28 + capLen <= len){
        packets.push({ ts: (th * 4294967296 + tl) / iface.divisor,
          incl: capLen, orig, data: new Uint8Array(buffer, off + 28, capLen),
          linktype: iface.linktype });
      }
    } else if (bt === 0x00000003){
      const orig = dv.getUint32(off + 8, le);
      const capLen = Math.min(orig, bl - 16);
      const iface = ifaces[0] || { linktype: 1, divisor: 1e6 };
      if (off + 12 + capLen <= len){
        packets.push({ ts: null, incl: capLen, orig,
          data: new Uint8Array(buffer, off + 12, capLen), linktype: iface.linktype });
      }
    } else if (bt === 0x00000002){
      const ifId = dv.getUint16(off + 8, le);
      const th = dv.getUint32(off + 12, le);
      const tl = dv.getUint32(off + 16, le);
      const capLen = dv.getUint32(off + 20, le);
      const orig = dv.getUint32(off + 24, le);
      const iface = ifaces[ifId] || { linktype: 1, divisor: 1e6 };
      if (off + 28 + capLen <= len){
        packets.push({ ts: (th * 4294967296 + tl) / iface.divisor,
          incl: capLen, orig, data: new Uint8Array(buffer, off + 28, capLen),
          linktype: iface.linktype });
      }
    }
    if (bl <= 0 || off + bl > len) break;
    off += bl;
  }
  let last = 0;
  for (const p of packets){ if (p.ts != null) last = p.ts; else p.ts = last; }
  return packets;
}

function parseCapture(buffer){
  const dv = new DataView(buffer);
  if (buffer.byteLength < 4) throw new Error('File too small');
  const m = dv.getUint32(0, false);
  if (m === 0x0A0D0D0A) return parsePcapNg(buffer);
  return parsePcap(buffer);
}

/* =====================================================================
   LINK / NETWORK / TRANSPORT
   ===================================================================== */
function ipv6Str(d, off){
  const g = [];
  for (let i = 0; i < 8; i++) g.push(((d[off + i*2] << 8) | d[off + i*2 + 1]).toString(16));
  let best = -1, bestLen = 0, cur = -1, curLen = 0;
  for (let i = 0; i < 8; i++){
    if (g[i] === '0'){ if (cur === -1) cur = i; curLen++; }
    else { if (curLen > bestLen){ best = cur; bestLen = curLen; } cur = -1; curLen = 0; }
  }
  if (curLen > bestLen){ best = cur; bestLen = curLen; }
  if (bestLen < 2) return g.join(':');
  return g.slice(0, best).join(':') + '::' + g.slice(best + bestLen).join(':');
}
const ipv4Str = (d, o) => d[o] + '.' + d[o+1] + '.' + d[o+2] + '.' + d[o+3];

function decodeLink(linktype, d){
  switch (linktype){
    case 1: {
      if (d.length < 14) return null;
      let et = (d[12] << 8) | d[13], p = 14;
      while (et === 0x8100 || et === 0x88a8 || et === 0x9100){
        if (p + 4 > d.length) return null;
        et = (d[p + 2] << 8) | d[p + 3]; p += 4;
      }
      return { ethertype: et, payload: d.subarray(p) };
    }
    case 0: {
      if (d.length < 4) return null;
      const fam = d[0] | (d[1] << 8) | (d[2] << 16) | (d[3] << 24);
      const et = fam === 2 ? 0x0800 : (fam === 30 || fam === 28 ? 0x86DD : 0);
      return { ethertype: et, payload: d.subarray(4) };
    }
    case 113: return { ethertype: (d[14] << 8) | d[15], payload: d.subarray(16) };
    case 276: return { ethertype: (d[0] << 8) | d[1], payload: d.subarray(20) };
    case 12: case 14: case 228: return { ethertype: 0x0800, payload: d };
    case 229: return { ethertype: 0x86DD, payload: d };
    case 101: return { ethertype: (d[0] >> 4) === 6 ? 0x86DD : 0x0800, payload: d };
    default: return null;
  }
}

function decodeIPv4(d){
  if (d.length < 20) return null;
  const vihl = d[0];
  if ((vihl >> 4) !== 4) return null;
  const ihl = (vihl & 0x0F) * 4;
  if (ihl < 20 || d.length < ihl) return null;
  const total = (d[2] << 8) | d[3];
  const ff = (d[6] << 8) | d[7];
  if ((ff & 0x1FFF) || (ff & 0x2000)) return null;
  return { src: ipv4Str(d, 12), dst: ipv4Str(d, 16), protocol: d[9],
    payload: d.subarray(ihl, Math.min(d.length, total || d.length)) };
}

function decodeIPv6(d){
  if (d.length < 40) return null;
  if ((d[0] >> 4) !== 6) return null;
  const plen = (d[4] << 8) | d[5];
  let next = d[6];
  const src = ipv6Str(d, 8), dst = ipv6Str(d, 24);
  let payload = d.subarray(40, Math.min(d.length, 40 + plen || d.length));
  let guard = 0;
  while (guard++ < 8){
    if (next === 0 || next === 43 || next === 60){
      if (payload.length < 8) break;
      const nh = payload[0], hl = (payload[1] + 1) * 8;
      payload = payload.subarray(hl); next = nh;
    } else if (next === 51){
      if (payload.length < 12) break;
      const nh = payload[0], hl = (payload[1] + 2) * 4;
      payload = payload.subarray(hl); next = nh;
    } else if (next === 44) return null;
    else break;
  }
  return { src, dst, next, payload };
}

function decodeTCP(d){
  if (d.length < 20) return null;
  const sport = (d[0] << 8) | d[1], dport = (d[2] << 8) | d[3];
  const seq = ((d[4] << 24) | (d[5] << 16) | (d[6] << 8) | d[7]) >>> 0;
  const doff = (d[12] >> 4) * 4;
  if (doff < 20 || doff > d.length) return null;
  return { sport, dport, seq, flags: d[13], payload: d.subarray(doff) };
}

function decodeUDP(d){
  if (d.length < 8) return null;
  const sport = (d[0] << 8) | d[1], dport = (d[2] << 8) | d[3];
  const len = (d[4] << 8) | d[5];
  return { sport, dport, payload: d.subarray(8, Math.min(d.length, len || d.length)) };
}

function decodeESP(d){
  for (const icvLen of [12, 16]){
    if (d.length < 8 + icvLen + 2) continue;
    const padLen = d[d.length - icvLen - 2];
    const nh = d[d.length - icvLen - 1];
    const pEnd = d.length - icvLen - 2 - padLen;
    if (pEnd <= 8) continue;
    if (![6, 17, 41, 50, 51, 58, 59, 60, 4, 0].includes(nh)) continue;
    const payload = d.subarray(8, pEnd);
    if (nh === 6){
      if (payload.length < 20) continue;
      const doff = (payload[12] >> 4) * 4;
      if (doff < 20 || doff > payload.length) continue;
    } else if (nh === 17){
      if (payload.length < 8) continue;
      const ul = (payload[4] << 8) | payload[5];
      if (ul < 8 || ul > payload.length + 8) continue;
    } else if (nh === 41){
      if (payload.length < 40 || (payload[0] >> 4) !== 6) continue;
    }
    return {
      spi: ((d[0] << 24) | (d[1] << 16) | (d[2] << 8) | d[3]) >>> 0,
      seq: ((d[4] << 24) | (d[5] << 16) | (d[6] << 8) | d[7]) >>> 0,
      nextHeader: nh, payload, icvLen
    };
  }
  return null;
}

function tryRTP(d){
  if (d.length < 12) return null;
  if ((d[0] >> 6) !== 2) return null;
  const pad = (d[0] >> 5) & 1, ext = (d[0] >> 4) & 1, cc = d[0] & 0x0F;
  const marker = (d[1] >> 7) & 1, pt = d[1] & 0x7F;
  const seq = (d[2] << 8) | d[3];
  const ts = ((d[4] << 24) | (d[5] << 16) | (d[6] << 8) | d[7]) >>> 0;
  const ssrc = ((d[8] << 24) | (d[9] << 16) | (d[10] << 8) | d[11]) >>> 0;
  let hlen = 12 + cc * 4;
  if (ext){
    if (d.length < hlen + 4) return null;
    hlen += 4 + ((d[hlen + 2] << 8) | d[hlen + 3]) * 4;
  }
  if (hlen > d.length) return null;
  let pEnd = d.length;
  if (pad){
    const p = d[pEnd - 1];
    if (p === 0 || pEnd - p < hlen) return null;
    pEnd -= p;
  }
  return { marker: !!marker, pt, seq, ts, ssrc, payload: d.subarray(hlen, pEnd) };
}

/* =====================================================================
   FRAME PIPELINE
   ===================================================================== */
function decodeOne(p, rp){
  const ll = decodeLink(rp.linktype, rp.data);
  if (!ll) return;
  let et = ll.ethertype, payload = ll.payload, next = null;

  if (et === 0x0800){
    const ip = decodeIPv4(payload); if (!ip) return;
    p.src = ip.src; p.dst = ip.dst;
    if (ip.payload.length === 0) return;
    payload = ip.payload; next = ip.protocol;
  } else if (et === 0x86DD){
    const ip = decodeIPv6(payload); if (!ip) return;
    p.src = ip.src; p.dst = ip.dst;
    payload = ip.payload; next = ip.next;
  } else return;

  let guard = 0;
  while (next === 50 && guard++ < 4){
    const esp = decodeESP(payload);
    if (!esp){ p.proto = 'ESP'; p.info = 'ESP (encrypted or unknown)'; return; }
    p.esp = esp;
    next = esp.nextHeader;
    payload = esp.payload;
  }

  if (next === 6){
    const tcp = decodeTCP(payload); if (!tcp) return;
    p.tcp = tcp; p.srcPort = tcp.sport; p.dstPort = tcp.dport;
    p.proto = 'TCP';
    p.info = tcp.sport + '→' + tcp.dport;
  } else if (next === 17){
    const udp = decodeUDP(payload); if (!udp) return;
    p.udp = udp; p.srcPort = udp.sport; p.dstPort = udp.dport;
    p.proto = 'UDP';
    p.info = udp.sport + '→' + udp.dport;
    const r = tryRTP(udp.payload);
    if (r){ p.rtp = r; p.proto = 'RTP'; p.info = 'SSRC=0x' + r.ssrc.toString(16) + ' PT=' + r.pt; }
  } else if (next === 58){
    p.proto = 'ICMPv6'; p.info = 'ICMPv6';
  } else {
    p.proto = 'IP-' + next; p.info = '';
  }
}

function decodeAll(rawPackets){
  const out = [];
  for (let i = 0; i < rawPackets.length; i++){
    const rp = rawPackets[i];
    const p = {
      no: i + 1, ts: rp.ts, capLen: rp.incl,
      src: '?', dst: '?', proto: '?', info: '',
      srcPort: null, dstPort: null, tcp: null, udp: null, rtp: null
    };
    try { decodeOne(p, rp); } catch(e){ p.proto = 'ERR'; p.info = e.message; }
    out.push(p);
  }
  return out;
}

/* =====================================================================
   TCP REASSEMBLY (for SIP only)
   ===================================================================== */
function reassembleTcpStreams(packets){
  const byKey = new Map();
  for (const p of packets){
    if (!p.tcp || p.srcPort == null) continue;
    const key = p.src + '|' + p.srcPort + '|' + p.dst + '|' + p.dstPort;
    if (!byKey.has(key)) byKey.set(key, []);
    byKey.get(key).push(p);
  }
  const streams = [];
  byKey.forEach((arr, key) => {
    arr.sort((a, b) => a.ts - b.ts);
    let base = null;
    for (const p of arr) if (p.tcp.flags & 0x02){ base = p.tcp.seq + 1; break; }
    if (base == null){
      const f = arr.find(p => p.tcp.payload.length);
      if (!f) return;
      base = f.tcp.seq;
    }
    const chunks = [];
    const seen = new Set();
    let maxEnd = 0;
    for (const p of arr){
      const pl = p.tcp.payload;
      if (!pl.length) continue;
      const off = ((p.tcp.seq - base) >>> 0);
      if (off > 0x7FFFFFFF) continue;
      const k = off + ':' + pl.length;
      if (seen.has(k)) continue;
      seen.add(k);
      chunks.push({ off, data: pl });
      if (off + pl.length > maxEnd) maxEnd = off + pl.length;
    }
    if (!maxEnd) return;
    chunks.sort((a, b) => a.off - b.off);
    const buf = new Uint8Array(maxEnd);
    for (const c of chunks) buf.set(c.data, c.off);
    streams.push({ src: arr[0].src, dst: arr[0].dst,
      sport: arr[0].srcPort, dport: arr[0].dstPort,
      bytes: buf, packets: arr, firstTs: arr[0].ts });
  });
  return streams;
}

/* =====================================================================
   SIP / SDP
   ===================================================================== */
function sniffSip(buf, i){
  const head = latin1(buf, i, Math.min(i + 12, buf.length));
  if (/^(INVITE|ACK|BYE|CANCEL|OPTIONS|REGISTER|PRACK|UPDATE|INFO|REFER|NOTIFY|MESSAGE|SUBSCRIBE|PUBLISH) /.test(head)) return 'request';
  if (head.startsWith('SIP/2.0 ')) return 'response';
  return null;
}
function findDoubleCrlf(buf, from){
  for (let i = from; i + 3 < buf.length; i++){
    if (buf[i] === 13 && buf[i+1] === 10 && buf[i+2] === 13 && buf[i+3] === 10) return i + 4;
    if (buf[i] === 10 && buf[i+1] === 10) return i + 2;
  }
  return -1;
}
function latin1(buf, a, b){
  let s = '';
  const end = Math.min(b, buf.length);
  for (let i = a; i < end; i++) s += String.fromCharCode(buf[i]);
  return s;
}

function parseSipMessagesFromStream(s, srcIp, dstIp){
  const msgs = [];
  const buf = s.bytes;
  let i = 0;
  while (i < buf.length){
    const kind = sniffSip(buf, i);
    if (!kind){ i++; continue; }
    const hEnd = findDoubleCrlf(buf, i);
    if (hEnd < 0) break;
    const headerText = latin1(buf, i, hEnd);
    const clMatch = headerText.match(/\r?\nContent-Length\s*:\s*(\d+)/i);
    const cl = clMatch ? +clMatch[1] : 0;
    const bEnd = hEnd + cl;
    if (bEnd > buf.length) break;
    const bodyText = cl ? latin1(buf, hEnd, bEnd) : '';
    const text = headerText + bodyText;
    const msgStartTs = findPacketTs(s, i);
    const m = parseSipMessageText(text, kind);
    m.ts = msgStartTs;
    m.src = srcIp; m.dst = dstIp;
    m.srcPort = s.sport; m.dstPort = s.dport;
    msgs.push(m);
    i = bEnd;
  }
  return msgs;
}

function findPacketTs(stream, byteOffset){
  const arr = stream.packets.slice().sort((a, b) => a.ts - b.ts);
  if (!arr.length) return 0;
  let base = null;
  for (const p of arr) if (p.tcp.flags & 0x02){ base = p.tcp.seq + 1; break; }
  if (base == null){
    const f = arr.find(p => p.tcp.payload.length);
    if (f) base = f.tcp.seq;
  }
  if (base == null) return arr[0].ts;
  for (const p of arr){
    if (!p.tcp.payload.length) continue;
    const off = ((p.tcp.seq - base) >>> 0);
    if (off <= byteOffset && byteOffset < off + p.tcp.payload.length) return p.ts;
  }
  return arr[0].ts;
}

function parseSipMessageText(text, kind){
  const lines = text.split(/\r?\n/);
  const start = lines[0] || '';
  const headers = {}, order = [];
  let i = 1;
  for (; i < lines.length; i++){
    const l = lines[i];
    if (l === '') break;
    const mm = l.match(/^([^:]+):\s*(.*)$/);
    if (mm){
      const n = mm[1].trim().toLowerCase();
      if (!headers[n]){ headers[n] = []; order.push(mm[1].trim()); }
      headers[n].push(mm[2].trim());
    }
  }
  const body = lines.slice(i + 1).join('\n');

  let label, method = null, statusCode = null;
  if (kind === 'request'){
    method = start.split(' ')[0]; label = method;
  } else {
    const m = start.match(/^SIP\/2\.0\s+(\d{3})\s*(.*)$/);
    statusCode = m ? +m[1] : 0;
    label = statusCode + (m && m[2] ? ' ' + m[2].trim() : '');
  }
  const cseq = (headers['cseq'] || [''])[0];
  const cseqM = cseq.match(/^\s*(\d+)\s+(\S+)/);

  const msg = {
    kind, label, method, statusCode,
    callId: (headers['call-id'] || [''])[0],
    cseq, cseqNum: cseqM ? +cseqM[1] : null,
    from: (headers['from'] || [''])[0],
    to: (headers['to'] || [''])[0],
    contact: (headers['contact'] || [''])[0],
    userAgent: (headers['user-agent'] || [''])[0],
    contentType: (headers['content-type'] || [''])[0],
    body,
    raw: text
  };
  if (/application\/sdp/i.test(msg.contentType) || /^\s*v=0/.test(body)){
    msg.sdp = parseSDP(body, msg);
  }
  return msg;
}

function parseSDP(text, owner){
  const lines = text.split(/\r?\n/);
  const session = {
    owner, connAddr: null, connType: null,
    origin: null, sessionName: null,
    media: []
  };
  let cur = null;

  for (const raw of lines){
    if (raw.length < 2 || raw[1] !== '=') continue;
    const t = raw[0], v = raw.slice(2).trim();
    switch (t){
      case 'o': {
        session.origin = v;
        const p = v.split(/\s+/);
        if (p.length >= 6){
          session.originUser = p[0];
          session.originAddr = p[5];
        }
        break;
      }
      case 's': session.sessionName = v; break;
      case 'c': {
        const m = v.match(/(IN)\s+(IP[46])\s+(\S+)/);
        if (m){
          if (cur){ cur.connAddr = m[3]; cur.connType = m[2]; }
          else { session.connAddr = m[3]; session.connType = m[2]; }
        }
        break;
      }
      case 'm': {
        const p = v.split(/\s+/);
        cur = {
          type: p[0], port: +p[1], proto: p[2],
          fmt: p.slice(3).map(x => +x),
          connAddr: null, connType: null,
          rtpmap: {}, fmtp: {}, attrs: [],
          direction: null, ptime: null, maxptime: null
        };
        session.media.push(cur);
        break;
      }
      case 'a': {
        if (!cur) break;
        const rm = v.match(/^rtpmap:(\d+)\s+([^/]+)\/(\d+)(?:\/(\d+))?/i);
        if (rm){
          cur.rtpmap[+rm[1]] = { name: rm[2], rate: +rm[3], ch: rm[4] ? +rm[4] : 1 };
          break;
        }
        const fm = v.match(/^fmtp:(\d+)\s+(.+)$/i);
        if (fm){
          cur.fmtp[+fm[1]] = fm[2];
          break;
        }
        const pm = v.match(/^ptime:(\d+)/i); if (pm){ cur.ptime = +pm[1]; break; }
        const mm = v.match(/^maxptime:(\d+)/i); if (mm){ cur.maxptime = +mm[1]; break; }
        if (/^(sendrecv|sendonly|recvonly|inactive)$/.test(v)){ cur.direction = v; break; }
        cur.attrs.push(v);
        break;
      }
    }
  }
  for (const m of session.media){
    m.effectiveAddr = m.connAddr || session.connAddr;
    m.effectiveAddrType = m.connType || session.connType;
  }
  return session;
}

function fmtpGet(fmtp, key){
  if (!fmtp) return null;
  const re = new RegExp('(?:^|;)\\s*' + key + '\\s*=\\s*([^;]+)', 'i');
  const m = fmtp.match(re);
  return m ? m[1].trim() : null;
}
function fmtpHas(fmtp, key){
  if (!fmtp) return false;
  return new RegExp('(?:^|;)\\s*' + key + '(?:\\s*=|\\s*(?:;|$))', 'i').test(fmtp);
}

function describeCodec(media, pt){
  const r = media.rtpmap[pt];
  const fmtp = media.fmtp[pt] || '';
  if (!r) return null;
  const name = r.name;
  const info = {
    pt, name: name.toUpperCase(), rate: r.rate, ch: r.ch,
    fmtp, isAMR: /^AMR(-WB)?$/i.test(name),
    isWB: /AMR-WB/i.test(name),
    isDTMF: /telephone-event/i.test(name),
    octetAlign: null, modeSet: null,
    modeChangeCapability: null, modeChangePeriod: null, modeChangeNeighbor: null,
    maxRed: null, robustSorting: null, crc: null, interleaving: null
  };
  if (info.isAMR){
    info.octetAlign = fmtpHas(fmtp, 'octet-align')
      ? (fmtpGet(fmtp, 'octet-align') === '1')
      : false;
    info.modeSet = fmtpGet(fmtp, 'mode-set');
    info.modeChangeCapability = fmtpGet(fmtp, 'mode-change-capability');
    info.modeChangePeriod = fmtpGet(fmtp, 'mode-change-period');
    info.modeChangeNeighbor = fmtpGet(fmtp, 'mode-change-neighbor');
    info.maxRed = fmtpGet(fmtp, 'max-red');
    info.robustSorting = fmtpHas(fmtp, 'robust-sorting');
    info.crc = fmtpHas(fmtp, 'crc');
    info.interleaving = fmtpGet(fmtp, 'interleaving');
  }
  return info;
}

function collectSdpMedia(sipMessages){
  const list = [];
  for (const m of sipMessages){
    if (!m.sdp) continue;
    for (const med of m.sdp.media){
      if (med.type !== 'audio') continue;
      list.push({
        sip: m,
        media: med,
        addr: med.effectiveAddr,
        port: med.port,
        codecs: med.fmt.map(pt => describeCodec(med, pt)).filter(Boolean),
        callId: m.callId
      });
    }
  }
  return list;
}

function correlateRTPToSDP(streams, sdpMedia){
  for (const g of streams){
    g.sdpMatch = null;
    g.sdpMatchWhy = '';
    g.sdpCandidates = [];

    for (const sm of sdpMedia){
      if (!sm.addr) continue;
      if (sm.addr.toLowerCase() === g.dst.toLowerCase() && sm.port === g.dport){
        for (const c of sm.codecs){
          if (c.pt === g.pt){
            g.sdpCandidates.push({ sm, codec: c, why: 'dst addr+port+pt' });
          }
        }
      }
      if (sm.addr.toLowerCase() === g.src.toLowerCase() && sm.port === g.sport){
        for (const c of sm.codecs){
          if (c.pt === g.pt){
            g.sdpCandidates.push({ sm, codec: c, why: 'src addr+port+pt' });
          }
        }
      }
    }
    if (!g.sdpCandidates.length){
      for (const sm of sdpMedia){
        if (sm.port === g.dport || sm.port === g.sport){
          for (const c of sm.codecs){
            if (c.pt === g.pt){
              g.sdpCandidates.push({ sm, codec: c, why: 'port+pt (no addr match)' });
            }
          }
        }
      }
    }
    if (!g.sdpCandidates.length){
      for (const sm of sdpMedia){
        for (const c of sm.codecs){
          if (c.pt === g.pt){
            g.sdpCandidates.push({ sm, codec: c, why: 'pt only' });
          }
        }
      }
    }
    if (g.sdpCandidates.length){
      const rank = w => w === 'dst addr+port+pt' ? 0 : w === 'src addr+port+pt' ? 1 : w === 'port+pt (no addr match)' ? 2 : 3;
      g.sdpCandidates.sort((a, b) => rank(a.why) - rank(b.why));
      g.sdpMatch = g.sdpCandidates[0];
      g.sdpMatchWhy = g.sdpMatch.why;
    }
  }
}

/* =====================================================================
   AMR MODE DETECTION (fallback when no SDP)
   ===================================================================== */
const AMR_NB_BITS = [95, 103, 118, 134, 148, 159, 204, 244, 39, 0, 0, 0, 0, 0, 0, 0];
const AMR_WB_BITS = [132, 177, 253, 285, 317, 365, 397, 461, 477, 40, 0, 0, 0, 0, 0, 0];

class BitReader {
  constructor(bytes){ this.b = bytes; this.pos = 0; this.total = bytes.length * 8; }
  read(n){
    let v = 0;
    for (let i = 0; i < n; i++){
      if (this.pos >= this.total) throw new Error('eof');
      const byte = this.b[this.pos >> 3];
      const bit = (byte >> (7 - (this.pos & 7))) & 1;
      v = (v << 1) | bit;
      this.pos++;
    }
    return v;
  }
  get remaining(){ return this.total - this.pos; }
}

function parseAMROctetAligned(payload, isWB){
  const BITS = isWB ? AMR_WB_BITS : AMR_NB_BITS;
  const frames = [];
  if (!payload.length) return { frames, ok: true };
  const cmr = (payload[0] >> 4) & 0x0F;
  if ((payload[0] & 0x0F) !== 0) return { frames, ok: false };
  let off = 1;
  while (off < payload.length){
    const toc = payload[off];
    const f = (toc >> 7) & 1;
    const ft = (toc >> 3) & 0x0F;
    const q = (toc >> 2) & 1;
    if ((toc & 0x03) !== 0) return { frames, ok: false };
    if (ft > 15) return { frames, ok: false };
    if (ft === 14 && !isWB) return { frames, ok: false };
    off++;
    const nbits = BITS[ft];
    const nbytes = Math.ceil(nbits / 8);
    if (off + nbytes > payload.length) return { frames, ok: false };
    frames.push({
      cmr, f, ft, q,
      speech: payload.subarray(off, off + nbytes),
      nbits
    });
    off += nbytes;
    if (f) break;
  }
  return { frames, ok: true };
}

function parseAMRBandwidthEfficient(payload, isWB){
  const BITS = isWB ? AMR_WB_BITS : AMR_NB_BITS;
  const frames = [];
  if (payload.length < 2) return { frames, ok: false };
  const br = new BitReader(payload);
  try {
    const cmr = br.read(4);
    let f = br.read(1);
    while (true){
      const ft = br.read(4);
      const q = br.read(1);
      if (ft === 14 && !isWB) return { frames, ok: false };
      const nbits = BITS[ft];
      let speech;
      if (nbits > 0){
        const out = new Uint8Array(Math.ceil(nbits / 8));
        let bitpos = 0;
        for (let i = 0; i < nbits; i++){
          const bit = br.read(1);
          if (bit) out[bitpos >> 3] |= 1 << (7 - (bitpos & 7));
          bitpos++;
        }
        speech = out;
      } else {
        speech = new Uint8Array(0);
      }
      frames.push({ cmr, f, ft, q, speech, nbits });
      if (f) break;
      if (br.remaining < 10) break;
      f = br.read(1);
    }
  } catch(e){ return { frames, ok: false }; }
  return { frames, ok: true };
}

function detectAMRMode(payloads){
  let best = null;
  const results = [];

  for (const isWB of [true, false]){
    for (const octetAlign of [true, false]){
      let totalFrames = 0, okPackets = 0, silentFrames = 0, speechFrames = 0;
      const ftHist = {};
      for (const payload of payloads.slice(0, 200)){
        if (!payload || payload.length < 2) continue;
        const r = octetAlign
          ? parseAMROctetAligned(payload, isWB)
          : parseAMRBandwidthEfficient(payload, isWB);
        if (r.ok && r.frames.length > 0){
          okPackets++;
          for (const f of r.frames){
            totalFrames++;
            ftHist[f.ft] = (ftHist[f.ft] || 0) + 1;
            if (f.ft === 15) silentFrames++;
            else if (f.ft !== 9 && f.ft !== 14) speechFrames++;
          }
        }
      }
      const okRate = payloads.length ? okPackets / Math.min(payloads.length, 200) : 0;
      results.push({
        isWB, octetAlign, okRate, totalFrames, okPackets,
        silentFrames, speechFrames, ftHist
      });
    }
  }

  for (const r of results){
    let s = r.okRate * 100;
    if (r.speechFrames > 0) s += 5;
    r.score = s;
  }
  results.sort((a, b) => b.score - a.score);
  best = results[0];

  const ev = [];
  ev.push(`${best.okPackets}/${Math.min(payloads.length, 200)} payloads parsed successfully ` +
          `(${(best.okRate * 100).toFixed(0)}%)`);
  const sortedFT = Object.entries(best.ftHist).sort((a, b) => b[1] - a[1]);
  if (sortedFT.length){
    ev.push('FT histogram: ' + sortedFT.slice(0, 6).map(([ft, n]) =>
      `FT ${ft} × ${n}`).join(', '));
  }
  if (best.ftHist[14] != null) ev.push('FT=14 observed (only valid for AMR-WB)');

  return {
    isWB: best.isWB,
    octetAlign: best.octetAlign,
    confidence: Math.min(100, Math.round(best.score)),
    evidence: ev,
    all: results
  };
}

/* =====================================================================
   AMR FILE WRITER
   ===================================================================== */
function buildAMRFile(rtpPackets, isWB, octetAlign, frameSamples, opts = {}){
  const replaceSid = opts.replaceSid !== false;
  const BITS  = isWB ? AMR_WB_BITS : AMR_NB_BITS;
  const SID_FT = isWB ? 9 : 8;
  const magic = isWB ? '#!AMR-WB\n' : '#!AMR\n';
  const out = [];
  for (let i = 0; i < magic.length; i++) out.push(magic.charCodeAt(i));

  const sorted = [...rtpPackets].sort((a, b) => a.extSeq - b.extSeq);
  const stats = {
    packets: sorted.length, framesEmitted: 0,
    speechFrames: 0, sidFrames: 0, sidReplaced: 0,
    noDataFrames: 0, lostFrames: 0, parseErrors: 0
  };

  let prevTS = null;
  for (const p of sorted){
    const ts = p.rtp.ts;

    if (prevTS != null){
      let d = (ts - prevTS) >>> 0;
      if (d > frameSamples && d < frameSamples * 500){
        const slots = Math.round(d / frameSamples) - 1;
        for (let i = 0; i < slots; i++){
          out.push(0x78);
          stats.noDataFrames++;
          stats.framesEmitted++;
        }
      }
    }

    const r = octetAlign
      ? parseAMROctetAligned(p.rtp.payload, isWB)
      : parseAMRBandwidthEfficient(p.rtp.payload, isWB);

    if (!r.ok || !r.frames.length){
      stats.parseErrors++;
      prevTS = ts;
      continue;
    }

    for (const f of r.frames){
      if (replaceSid && f.ft === SID_FT){
        out.push(0x78);
        stats.sidFrames++;
        stats.sidReplaced++;
        stats.framesEmitted++;
        continue;
      }

      const toc = (f.f << 7) | (f.ft << 3) | (f.q << 2);
      out.push(toc);
      stats.framesEmitted++;

      const nbits  = BITS[f.ft];
      const nbytes = Math.ceil(nbits / 8);

      if (f.ft === 15){
        stats.noDataFrames++;
      } else if (f.ft === SID_FT){
        stats.sidFrames++;
        for (let i = 0; i < nbytes; i++) out.push(f.speech[i] || 0);
      } else if (f.ft === 14){
        stats.lostFrames++;
      } else {
        stats.speechFrames++;
        for (let i = 0; i < nbytes; i++) out.push(f.speech[i] || 0);
      }
    }
    prevTS = ts;
  }

  return { bytes: new Uint8Array(out), stats, magic: magic.trim() };
}

/* =====================================================================
   RTP STREAM GROUPING
   ===================================================================== */
function analyzeRtpStreams(packets){
  const groups = new Map();
  for (const p of packets){
    if (!p.rtp) continue;
    const key = p.rtp.ssrc + '|' + p.src + '|' + p.srcPort + '|' + p.dst + '|' + p.dstPort + '|' + p.rtp.pt;
    if (!groups.has(key)){
      groups.set(key, {
        key, ssrc: p.rtp.ssrc,
        src: p.src, dst: p.dst, sport: p.srcPort, dport: p.dstPort,
        pt: p.rtp.pt, packets: [], firstTs: p.ts
      });
    }
    groups.get(key).packets.push(p);
  }
  const out = [];
  for (const g of groups.values()){
    g.packets.sort((a, b) => a.ts - b.ts);
    let prev = g.packets[0].rtp.seq, ext = prev;
    g.packets[0].extSeq = ext;
    for (let i = 1; i < g.packets.length; i++){
      const s = g.packets[i].rtp.seq;
      let d = s - prev;
      if (d < -32768) d += 65536;
      else if (d > 32768) d -= 65536;
      ext += d;
      g.packets[i].extSeq = ext;
      prev = s;
    }
    const seqs = g.packets.map(p => p.extSeq);
    g.minSeq = Math.min(...seqs);
    g.maxSeq = Math.max(...seqs);
    g.expected = g.maxSeq - g.minSeq + 1;
    g.lost = Math.max(0, g.expected - g.packets.length);
    g.lossPct = g.expected ? (g.lost / g.expected * 100) : 0;
    g.count = g.packets.length;
    g.lastTs = g.packets[g.packets.length - 1].ts;
    g.arrivalSpan = g.lastTs - g.firstTs;
    out.push(g);
  }
  out.sort((a, b) => b.count - a.count);
  return out;
}

/* =====================================================================
   STREAM CLASSIFICATION
   ===================================================================== */
function classifyStream(g){
  const payloads = g.packets.slice(0, 200).map(p => p.rtp.payload);
  const sdpCodec = g.sdpMatch ? g.sdpMatch.codec : null;
  const isDTMFFromSdp = sdpCodec && sdpCodec.isDTMF;
  const isAMRFromSdp  = sdpCodec && sdpCodec.isAMR;

  let looksDTMF = false;
  if (!sdpCodec && payloads.length && payloads[0] && payloads[0].length === 4){
    const ok = payloads.slice(0, 20).every(pl =>
      pl.length === 4 && pl[0] >= 0 && pl[0] <= 15 && pl[3] === 0);
    if (ok) looksDTMF = true;
  }

  const isDTMF = isDTMFFromSdp || looksDTMF;

  if (isDTMF){
    return {
      codec: 'telephone-event',
      isAMR: false, isWB: false, isDTMF: true,
      clock: sdpCodec ? sdpCodec.rate : 8000,
      octetAlign: null, modeSet: null, fmtp: sdpCodec ? sdpCodec.fmtp : '',
      source: sdpCodec ? 'SDP' : 'inferred',
      evidence: sdpCodec ? ['codec from SDP'] : ['payload shape matches RFC 4733']
    };
  }

  const detected = detectAMRMode(payloads);
  const isAMR = isAMRFromSdp || /^AMR/i.test(sdpCodec?.name || '') ||
                detected.confidence > 50;

  if (!isAMR){
    return {
      codec: sdpCodec ? sdpCodec.name : 'unknown',
      isAMR: false, isWB: false, isDTMF: false,
      clock: sdpCodec ? sdpCodec.rate : 8000,
      octetAlign: null, modeSet: null, fmtp: sdpCodec ? sdpCodec.fmtp : '',
      source: sdpCodec ? 'SDP' : 'n/a',
      evidence: sdpCodec ? ['codec from SDP'] : ['unrecognised codec']
    };
  }

  let isWB, octetAlign, source, evidence = [];

  if (isAMRFromSdp){
    isWB = sdpCodec.isWB;
    octetAlign = sdpCodec.octetAlign;
    source = 'SDP';
    evidence.push('codec announced in SDP: ' + sdpCodec.name + ' @ ' + sdpCodec.rate + ' Hz');
    if (sdpCodec.modeSet) evidence.push('mode-set=' + sdpCodec.modeSet);
    if (sdpCodec.modeChangeCapability) evidence.push('mode-change-capability=' + sdpCodec.modeChangeCapability);
    if (sdpCodec.maxRed) evidence.push('max-red=' + sdpCodec.maxRed);
    if (sdpCodec.octetAlign !== null){
      evidence.push('octet-align=' + (sdpCodec.octetAlign ? '1' : '0'));
    }
  } else {
    isWB = detected.isWB;
    octetAlign = detected.octetAlign;
    source = 'inferred';
    evidence.push('SDP not available for this stream — inferred from payload structure');
    evidence.push('confidence: ' + detected.confidence + '%');
    evidence = evidence.concat(detected.evidence);
  }

  const clock = isWB ? 16000 : 8000;

  const deltas = [];
  for (let i = 1; i < g.packets.length; i++){
    let d = (g.packets[i].rtp.ts - g.packets[i - 1].rtp.ts) >>> 0;
    if (d > 0 && d < clock * 2) deltas.push(d);
  }
  deltas.sort((a, b) => a - b);
  let frameSamples = deltas.length ? deltas[Math.floor(deltas.length / 2)] : clock / 50;
  if (frameSamples <= 0 || frameSamples > clock) frameSamples = clock / 50;

  const firstTS = g.packets[0].rtp.ts;
  const lastTS  = g.packets[g.packets.length - 1].rtp.ts;
  const tsSpan  = (lastTS - firstTS) >>> 0;
  const mediaDuration = (tsSpan + frameSamples) / clock;

  return {
    codec: isWB ? 'AMR-WB' : 'AMR',
    isAMR: true, isWB, isDTMF: false,
    clock, octetAlign, frameSamples, mediaDuration, tsSpan,
    modeSet: sdpCodec ? sdpCodec.modeSet : null,
    fmtp: sdpCodec ? sdpCodec.fmtp : '',
    source, evidence,
    sdpCodec
  };
}

/* =====================================================================
   FRAME-TYPE STATISTICS
   ===================================================================== */
function countFrameTypes(g, cls){
  const SID_FT = cls.isWB ? 9 : 8;
  let speech = 0, sid = 0, noData = 0, lost = 0, parseErr = 0, total = 0;
  const ftHist = {};
  for (const p of g.packets){
    const r = cls.octetAlign
      ? parseAMROctetAligned(p.rtp.payload, cls.isWB)
      : parseAMRBandwidthEfficient(p.rtp.payload, cls.isWB);
    if (!r.ok || !r.frames.length){ parseErr++; continue; }
    for (const f of r.frames){
      total++;
      ftHist[f.ft] = (ftHist[f.ft] || 0) + 1;
      if (f.ft === 15) noData++;
      else if (f.ft === SID_FT) sid++;
      else if (f.ft === 14) lost++;
      else speech++;
    }
  }
  return { speech, sid, noData, lost, parseErr, total, ftHist };
}

/* =====================================================================
   ffmpeg.wasm  (fixed: single declaration)
   ===================================================================== */
let ffmpegPromise = null;
let ffmpegPromise = null;
function getFFmpeg(){
  if (ffmpegPromise) return ffmpegPromise;
  ffmpegPromise = (async () => {
    if (typeof FFmpegWASM === 'undefined' || typeof FFmpegWASM.FFmpeg !== 'function')
      throw new Error('@ffmpeg/ffmpeg failed to load from CDN (FFmpegWASM.FFmpeg missing)');
    if (typeof FFmpegUtil === 'undefined' || typeof FFmpegUtil.toBlobURL !== 'function')
      throw new Error('@ffmpeg/util failed to load from CDN (FFmpegUtil.toBlobURL missing)');

    const { FFmpeg } = FFmpegWASM;
    const { toBlobURL } = FFmpegUtil;

    const ffmpegVersion = '0.12.10';
    const coreVersion   = '0.12.6';

    // Browsers refuse `new Worker(crossOriginUrl)`.  So we build a tiny
    // same-origin ES-module wrapper that dynamically imports the real
    // worker chunk from the CDN.  FFmpeg constructs its worker with
    // { type: 'module' }, so the wrapper must be valid ESM — which it is.
    const workerURL = `https://unpkg.com/@ffmpeg/ffmpeg@${ffmpegVersion}/dist/umd/814.ffmpeg.js`;
    const wrapperCode = `await import(${JSON.stringify(workerURL)});`;
    const wrapperBlob = new Blob([wrapperCode], { type: 'text/javascript' });
    const classWorkerURL = URL.createObjectURL(wrapperBlob);

    const coreBase = `https://unpkg.com/@ffmpeg/core@${coreVersion}/dist/umd`;

    let coreURL, wasmURL;
    try {
      coreURL = await toBlobURL(`${coreBase}/ffmpeg-core.js`,   'text/javascript');
      wasmURL = await toBlobURL(`${coreBase}/ffmpeg-core.wasm`, 'application/wasm');
    } catch (e) {
      throw new Error('Failed to fetch ffmpeg core from unpkg: ' + (e && e.message ? e.message : e));
    }

    const ff = new FFmpeg();
    await ff.load({ coreURL, wasmURL, classWorkerURL });
    return ff;
  })();
  // Allow retry on next call if it failed.
  ffmpegPromise.catch(() => { ffmpegPromise = null; });
  return ffmpegPromise;
}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function fmtDur(s){
  if (!isFinite(s) || s < 0) return '—';
  if (s < 60) return s.toFixed(3) + ' s';
  const m = Math.floor(s / 60), r = s - m * 60;
  return m + 'm ' + r.toFixed(2) + 's';
}
function fmtBytes(n){
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
}

const state = { packets: [], sip: [], sdpMedia: [], streams: [], classifications: new Map() };

async function loadFile(file){
  $('#drop').innerHTML = '<div class="spinner"></div><p style="text-align:center;color:var(--muted)">Decoding capture…</p>';
  await new Promise(r => setTimeout(r, 40));

  try {
    const buf = await file.arrayBuffer();
    const rawPackets = parseCapture(buf);
    if (!rawPackets.length) throw new Error('No packets found');

    const packets = decodeAll(rawPackets);

    const streams = reassembleTcpStreams(packets);
    const sip = [];
    for (const s of streams){
      const msgs = parseSipMessagesFromStream(s, s.src, s.dst);
      for (const m of msgs) sip.push(m);
    }

    state.packets = packets;
    state.sip = sip;
    state.sdpMedia = collectSdpMedia(sip);
    state.streams = analyzeRtpStreams(packets);
    correlateRTPToSDP(state.streams, state.sdpMedia);

    state.classifications.clear();
    for (const g of state.streams){
      state.classifications.set(g.key, classifyStream(g));
    }

    render(file.name);
  } catch (e){
    console.error(e);
    $('#drop').innerHTML = `
      <div class="errbox" style="max-width:640px;margin:0 auto;text-align:left">
        <b>Could not parse the file.</b><br>${esc(e.message)}<br><br>
        Supported: <code>.pcap</code> (all magic variants) and <code>.pcapng</code>.
      </div>
      <p style="margin-top:22px"><button class="btn primary" id="pickBtn2">Try another file</button></p>`;
    const b = document.getElementById('pickBtn2');
    if (b) b.onclick = () => $('#fileInput').click();
  }
}

function render(fileName){
  $('#drop').hidden = true;
  $('#app').hidden = false;
  $('#fileName').textContent = fileName;

  const rtpN = state.streams.length;
  const amrN = [...state.classifications.values()].filter(c => c.isAMR).length;
  const dtmfN = [...state.classifications.values()].filter(c => c.isDTMF).length;

  let html = '';

  html += `<div class="summary">
    <div class="stat"><div class="l">Frames</div><div class="v">${state.packets.length}</div></div>
    <div class="stat"><div class="l">RTP streams</div><div class="v">${rtpN}</div></div>
    <div class="stat"><div class="l">AMR streams</div><div class="v">${amrN}</div></div>
    <div class="stat"><div class="l">DTMF streams</div><div class="v">${dtmfN}</div></div>
  </div>`;

  if (!state.sdpMedia.length && amrN > 0){
    html += `<div class="warnbox">
      <b>No SDP found in this capture.</b> AMR mode (AMR-NB vs AMR-WB) and alignment
      (octet-aligned vs bandwidth-efficient) were inferred from the RTP payload structure.
      Check the per-stream readout below before trusting the output.
    </div>`;
  }

  html += `<section><h2>RTP Streams <span class="badge">${state.streams.length}</span></h2>`;
  if (!state.streams.length){
    html += `<div class="card"><div class="hint">No RTP streams found.</div></div>`;
  } else {
    let idx = 0;
    for (const g of state.streams){
      idx++;
      const cls = state.classifications.get(g.key);
      html += renderStreamCard(g, cls, idx);
    }
  }
  html += `</section>`;

  $('#content').innerHTML = html;

  let i = 0;
  for (const g of state.streams){
    i++;
    const cls = state.classifications.get(g.key);
    const btn = document.getElementById('extract-' + i);
    if (btn && cls.isAMR){
      btn.onclick = () => extractAMR(g, cls, i);
    }
    const conv = document.getElementById('convert-' + i);
    if (conv && cls.isAMR){
      conv.onclick = () => convertToWav(g, cls, i);
    }
    const peek = document.getElementById('peek-' + i);
    if (peek){
      peek.onclick = () => {
        const el = document.getElementById('peekbody-' + i);
        el.hidden = !el.hidden;
        peek.textContent = el.hidden ? 'Show first 3 payloads' : 'Hide payloads';
      };
    }
  }
}

function renderStreamCard(g, cls, i){
  const ext = cls.isAMR ? (cls.isWB ? 'awb' : 'amr') : '';
  const sdpLine = g.sdpMatch
    ? `<span class="tag ok">SDP: PT ${g.sdpMatch.codec.pt} ${esc(g.sdpMatch.codec.name)}</span>`
    : (state.sdpMedia.length
        ? '<span class="tag err">no SDP match</span>'
        : '<span class="tag warn">SDP absent</span>');

  const srcTag = cls.isAMR
    ? (cls.source === 'SDP'
        ? '<span class="tag info">mode from SDP</span>'
        : '<span class="tag warn">mode inferred</span>')
    : '';

  let html = `<div class="card">
    <h3>Stream ${i}
      <span class="tag">SSRC 0x${g.ssrc.toString(16).padStart(8, '0')}</span>
      <span class="tag">PT ${g.pt}</span>
      <span class="tag">${g.count} pkts</span>
      ${sdpLine} ${srcTag}
    </h3>
    <dl class="kv">
      <dt>Endpoints</dt><dd>${esc(g.src)}:${g.sport} → ${esc(g.dst)}:${g.dport}</dd>
      <dt>Codec</dt><dd>${esc(cls.codec || 'unknown')}</dd>
      ${cls.isAMR ? `
        <dt>Clock</dt><dd>${cls.clock} Hz</dd>
        <dt>Frame size</dt><dd>${cls.frameSamples} samples (${(cls.frameSamples / cls.clock * 1000).toFixed(1)} ms)</dd>
        <dt>Media duration</dt><dd style="color:#a3e6b8">${fmtDur(cls.mediaDuration)}</dd>
        <dt>Lost packets</dt><dd>${g.lost} (${g.lossPct.toFixed(2)}%)</dd>
      ` : ''}
    </dl>`;

  if (cls.isAMR){
    const ft = countFrameTypes(g, cls);
    const sidLabel = cls.isWB ? 'SID / comfort noise (FT 9)' : 'SID / comfort noise (FT 8)';

    html += `<div class="grid2" style="margin-top:12px">
      <div class="panelbox">
        <h4>Mode &amp; Alignment</h4>
        <div class="frow"><span class="k">Codec</span>
          <span class="v" style="color:#8cc3ff">${esc(cls.codec)}</span></div>
        <div class="frow"><span class="k">Alignment</span>
          <span class="v">${cls.octetAlign
            ? '<span class="tag warn big">octet-aligned</span>'
            : '<span class="tag ok big">bandwidth-efficient</span>'}</span></div>
        <div class="frow"><span class="k">Clock</span>
          <span class="v">${cls.clock} Hz</span></div>
        <div class="frow"><span class="k">Mode source</span>
          <span class="v">${esc(cls.source)}</span></div>
        ${cls.modeSet ? `<div class="frow"><span class="k">mode-set</span>
          <span class="v">${esc(cls.modeSet)}</span></div>` : ''}
      </div>
      <div class="panelbox">
        <h4>Frame breakdown (all packets)</h4>
        <div class="frow"><span class="k">Speech frames</span>
          <span class="v">${ft.speech}</span></div>
        <div class="frow"><span class="k">${esc(sidLabel)}</span>
          <span class="v" style="color:#e5b955">${ft.sid}</span></div>
        <div class="frow"><span class="k">NO_DATA (FT 15)</span>
          <span class="v">${ft.noData}</span></div>
        <div class="frow"><span class="k">Lost / no-data (FT 14)</span>
          <span class="v">${ft.lost}</span></div>
        <div class="frow"><span class="k">Parse errors</span>
          <span class="v" style="color:${ft.parseErr ? 'var(--err)' : 'var(--muted)'}">${ft.parseErr}</span></div>
        <div class="frow"><span class="k">Total frames</span>
          <span class="v">${ft.total}</span></div>
      </div>
    </div>`;

    html += `<div style="margin-top:10px;font-size:12px;color:var(--muted)">
      <b style="color:var(--text)">Mode evidence:</b><br>
      ${cls.evidence.map(e => '· ' + esc(e)).join('<br>')}
    </div>`;

    html += `<div class="actions">
      <button class="btn ok" id="extract-${i}">Download stream-${i}.${ext}</button>
      <button class="btn primary" id="convert-${i}">Convert to WAV (ffmpeg.wasm)</button>
      <button class="btn" id="peek-${i}">Show first 3 payloads</button>
    </div>
    <div id="peekbody-${i}" hidden style="margin-top:10px">
      ${g.packets.slice(0, 3).map((p, k) => `
        <div style="margin-bottom:8px">
          <div style="color:var(--muted);font-size:11px;margin-bottom:3px">
            Packet #${p.no} · seq ${p.rtp.seq} · ts ${p.rtp.ts} · ${p.rtp.payload.length} payload bytes
          </div>
          <div class="bytes">${esc(hexLines(p.rtp.payload))}</div>
        </div>`).join('')}
    </div>
    <div id="report-${i}" style="margin-top:10px;font-size:12px"></div>`;
  } else if (cls.isDTMF){
    html += `<div class="infobox" style="margin-top:10px">
      DTMF stream (RFC 4733 telephone-event). Not an AMR audio stream — no extraction.
    </div>`;
  } else {
    html += `<div class="infobox" style="margin-top:10px">
      Non-AMR codec. No extraction available.
    </div>`;
  }

  html += `</div>`;
  return html;
}

function hexLines(bytes){
  const lines = [];
  for (let i = 0; i < bytes.length && i < 96; i += 16){
    const chunk = bytes.subarray(i, Math.min(i + 16, bytes.length));
    let h = '', a = '';
    for (let j = 0; j < 16; j++){
      if (j < chunk.length){
        h += chunk[j].toString(16).padStart(2, '0') + ' ';
        a += (chunk[j] >= 32 && chunk[j] < 127) ? String.fromCharCode(chunk[j]) : '.';
      } else { h += '   '; a += ' '; }
    }
    lines.push(i.toString(16).padStart(4, '0') + '  ' + h + ' ' + a);
  }
  if (bytes.length > 96) lines.push('… (' + (bytes.length - 96) + ' more bytes)');
  return lines.join('\n');
}

/* ---- Extract .amr / .awb ---- */
function extractAMR(g, cls, idx){
  const rep = document.getElementById('report-' + idx);
  rep.innerHTML = '<span style="color:var(--muted)">Building file…</span>';

  try {
    const built = buildAMRFile(g.packets, cls.isWB, cls.octetAlign, cls.frameSamples, { replaceSid: true });
    const ext = cls.isWB ? 'awb' : 'amr';
    const name = `stream-${idx}-ssrc-${g.ssrc.toString(16)}.${ext}`;
    const blob = new Blob([built.bytes], { type: 'audio/amr' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);

    const totalDuration = built.stats.framesEmitted * (cls.frameSamples / cls.clock);
    rep.innerHTML = `
      <div class="okbox">
        <b>${esc(name)}</b> written — ${fmtBytes(built.bytes.length)}<br>
        Frames: <b>${built.stats.framesEmitted}</b> =
          ${built.stats.speechFrames} speech
          + ${built.stats.sidReplaced} SID→NO_DATA
          + ${built.stats.noDataFrames} NO_DATA
          ${built.stats.lostFrames ? '+ ' + built.stats.lostFrames + ' lost' : ''}<br>
        ${built.stats.parseErrors ? `<b style="color:var(--warn)">${built.stats.parseErrors} payloads failed to parse</b><br>` : ''}
        Duration: <b>${fmtDur(totalDuration)}</b>
        (RTP timestamps say ${fmtDur(cls.mediaDuration)})
      </div>`;
  } catch(e){
    rep.innerHTML = `<div class="errbox">Extraction failed: ${esc(e.message)}</div>`;
  }
}

/* ---- Convert to WAV using ffmpeg.wasm ---- */
/* ---- Convert to WAV using ffmpeg.wasm ---- */
async function convertToWav(g, cls, idx){
  const rep = document.getElementById('report-' + idx);
  const btn = document.getElementById('convert-' + idx);
  if (btn) btn.disabled = true;

  // Build a stable status element + log element once, so nothing we do
  // later (innerHTML on rep.firstElementChild) can wipe them.
  rep.innerHTML = '';
  const status = document.createElement('div');
  status.className = 'infobox';
  status.textContent = 'Loading ffmpeg.wasm (first run downloads ~30 MB)…';
  const logBox = document.createElement('div');
  logBox.className = 'fflog';
  rep.appendChild(status);
  rep.appendChild(logBox);

  const appendLog = m => {
    logBox.textContent += m + '\n';
    logBox.scrollTop = logBox.scrollHeight;
  };

  try {
    const ff = await getFFmpeg();
    logBox.classList.add('show');

    const ext = cls.isWB ? 'awb' : 'amr';
    const inName  = 'in.' + ext;
    const outName = 'out.wav';

    /* build the AMR/WB blob (SID → NO_DATA substitution keeps ffmpeg happy) */
    status.textContent = 'Building AMR file…';
    const built = buildAMRFile(g.packets, cls.isWB, cls.octetAlign,
                               cls.frameSamples, { replaceSid: true });

    await ff.writeFile(inName, built.bytes);

    status.textContent = 'Decoding with ffmpeg.wasm…';
    // Register the log listener once per conversion.  Using { once:false }
    // here is fine — ffmpeg re-emits 'log' on every exec().
    ff.on('log', ({ message }) => appendLog(message));

    await ff.exec([
      '-hide_banner', '-y',
      '-i', inName,
      '-ar', String(cls.clock),
      '-ac', '1',
      outName
    ]);

    const data = await ff.readFile(outName);
    // readFile returns Uint8Array; make an ArrayBuffer copy so Blob() is happy.
    const wavBytes = data instanceof Uint8Array ? data : new Uint8Array(data);
    const wavBlob  = new Blob([wavBytes.buffer], { type: 'audio/wav' });

    const wavName = `stream-${idx}-ssrc-${g.ssrc.toString(16)}.wav`;
    const url = URL.createObjectURL(wavBlob);
    const a = document.createElement('a');
    a.href = url; a.download = wavName;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);

    status.outerHTML = `
      <div class="okbox">
        <b>${esc(wavName)}</b> written — ${fmtBytes(wavBlob.size)}<br>
        ${cls.clock} Hz · mono · ${fmtDur(built.stats.framesEmitted * cls.frameSamples / cls.clock)}<br>
        WAV downloaded. The <code>.${ext}</code> file is still available via the button above.
      </div>`;

    try { await ff.deleteFile(inName); } catch(e){}
    try { await ff.deleteFile(outName); } catch(e){}
  } catch(e){
    console.error('ffmpeg.wasm conversion failed:', e);
    const msg = e && e.message ? e.message : (e == null ? 'unknown error' : String(e));
    status.outerHTML = `<div class="errbox">
      ffmpeg.wasm failed: ${esc(msg)}<br>
      <span style="font-size:11px;color:#8b98a8">
        Fallback: download the .${cls.isWB ? 'awb' : 'amr'} file above and run
        <code>ffmpeg -i file.${cls.isWB ? 'awb' : 'amr'} out.wav</code> natively.
      </span>
    </div>`;
  } finally {
    if (btn) btn.disabled = false;
  }
}
